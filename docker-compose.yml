services:
  app:
    build: .
    container_name: vertiq-app
    ports:
      - "8080:8000"
    environment:
      APP_NAME: "Vertical CRM with Embedded AI"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: vertiq
      DB_USERNAME: vertiq
      DB_PASSWORD: secret
      MODULE_CONTACTS: "true"
      MODULE_DEALS: "true"
      MODULE_PIPELINE: "true"
      MODULE_SCORING_AI: "true"
      MODULE_NEXT_BEST_ACTIONS: "true"
      MODULE_VERTICAL_FIELDS: "true"
      MODULE_REVENUE_WORKFLOWS: "true"
      MODULE_ACTIVITIES: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.4
    container_name: vertiq-mysql
    environment:
      MYSQL_DATABASE: vertiq
      MYSQL_USER: vertiq
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - vertiq_mysql:/var/lib/mysql

volumes:
  vertiq_mysql:
